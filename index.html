<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Repair Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .nav { display: flex; background: #f8f9fa; border-bottom: 2px solid #e9ecef; flex-wrap: wrap; }
        .nav button { flex: 1; padding: 15px; border: none; background: transparent; cursor: pointer; font-size: 1em; font-weight: 600; color: #495057; transition: all 0.3s; min-width: 150px; }
        .nav button:hover { background: #e9ecef; }
        .nav button.active { background: #667eea; color: white; }
        .content { padding: 30px; }
        .section { display: none; }
        .section.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 2.5em; margin-bottom: 5px; }
        .stat-card p { font-size: 1.1em; opacity: 0.9; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 1em; transition: border 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-right: 10px; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .job-list { display: grid; gap: 15px; }
        .job-card { background: #f8f9fa; padding: 20px; border-radius: 10px; border-left: 4px solid #667eea; cursor: pointer; transition: all 0.3s; }
        .job-card:hover { transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .job-card h4 { color: #667eea; margin-bottom: 10px; }
        .job-card p { color: #6c757d; margin-bottom: 5px; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: 600; }
        .status-pending { background: #ffc107; color: #000; }
        .status-progress { background: #17a2b8; color: white; }
        .status-completed { background: #28a745; color: white; }
        .checklist { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .checklist-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #e9ecef; }
        .checklist-item:last-child { border-bottom: none; }
        .checklist-item input[type="checkbox"] { margin-right: 15px; width: 20px; height: 20px; }
        .signature-pad { border: 2px solid #e9ecef; border-radius: 10px; margin-bottom: 20px; background: white; touch-action: none; }
        .receipt { background: white; padding: 30px; border: 2px solid #e9ecef; border-radius: 10px; font-family: 'Courier New', monospace; }
        .receipt-header { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 20px; margin-bottom: 20px; }
        .receipt-section { margin-bottom: 20px; }
        .receipt-section h4 { border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
        .signature-line { margin-top: 40px; display: flex; justify-content: space-between; }
        .signature-box { text-align: center; flex: 1; }
        .signature-box img { max-width: 200px; height: 100px; border: 1px solid #000; margin-bottom: 10px; }
        @media (max-width: 768px) { .header h1 { font-size: 1.8em; } .nav { flex-direction: column; } .nav button { min-width: 100%; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Mobile Repair Management</h1>
            <p>Professional Repair Service System</p>
        </div>
        <div class="nav">
            <button class="nav-btn active" onclick="showSection('dashboard', this)">📊 Dashboard</button>
            <button class="nav-btn" onclick="showSection('new-job', this)">➕ New Job</button>
            <button class="nav-btn" onclick="showSection('jobs', this)">📋 Jobs</button>
            <button class="nav-btn" onclick="showSection('customers', this)">👥 Customers</button>
        </div>
        <div class="content">
            <div id="dashboard" class="section active">
                <div class="stats-grid">
                    <div class="stat-card"><h3 id="total-jobs">0</h3><p>Total Jobs</p></div>
                    <div class="stat-card"><h3 id="active-jobs">0</h3><p>Active Jobs</p></div>
                    <div class="stat-card"><h3 id="completed-jobs">0</h3><p>Completed</p></div>
                    <div class="stat-card"><h3 id="total-customers">0</h3><p>Customers</p></div>
                </div>
                <h2 style="margin-bottom: 20px;">Recent Jobs</h2>
                <div id="recent-jobs" class="job-list"></div>
            </div>
            <div id="new-job" class="section">
                <h2 style="margin-bottom: 20px;">Create New Job Order</h2>
                <form id="job-form">
                    <div class="form-group"><label>Customer Name *</label><input type="text" id="customer-name" required></div>
                    <div class="form-group"><label>Phone Number *</label><input type="tel" id="customer-phone" required></div>
                    <div class="form-group"><label>Device Model *</label><input type="text" id="device-model" placeholder="e.g., iPhone 13 Pro Max" required></div>
                    <div class="form-group"><label>IMEI Number</label><input type="text" id="device-imei" placeholder="15 digits"></div>
                    <div class="form-group"><label>Issue Description *</label><textarea id="issue-desc" rows="4" required></textarea></div>
                    <div class="form-group"><label>Estimated Price (RM) *</label><input type="number" id="estimated-price" step="0.01" required></div>
                    <button type="submit" class="btn btn-primary">Create Job Order</button>
                </form>
            </div>
            <div id="jobs" class="section">
                <h2 style="margin-bottom: 20px;">All Jobs</h2>
                <div id="all-jobs" class="job-list"></div>
            </div>
            <div id="customers" class="section">
                <h2 style="margin-bottom: 20px;">Customer Database</h2>
                <div id="customer-list" class="job-list"></div>
            </div>
            <div id="job-detail" class="section">
                <button onclick="showSection('jobs', document.querySelectorAll('.nav-btn')[2])" class="btn btn-danger" style="margin-bottom: 20px;">← Back</button>
                <div id="job-detail-content"></div>
            </div>
        </div>
    </div>
    <script>
        let jobs = JSON.parse(localStorage.getItem('repair-jobs')) || [];
        let customers = JSON.parse(localStorage.getItem('repair-customers')) || [];
        
        function showSection(sectionId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            if (btn) btn.classList.add('active');
            if (sectionId === 'dashboard') updateDashboard();
            if (sectionId === 'jobs') renderJobs();
            if (sectionId === 'customers') renderCustomers();
        }
        
        function updateDashboard() {
            document.getElementById('total-jobs').textContent = jobs.length;
            document.getElementById('active-jobs').textContent = jobs.filter(j => j.status !== 'completed').length;
            document.getElementById('completed-jobs').textContent = jobs.filter(j => j.status === 'completed').length;
            document.getElementById('total-customers').textContent = customers.length;
            const recentJobs = jobs.slice(-5).reverse();
            document.getElementById('recent-jobs').innerHTML = recentJobs.length ? recentJobs.map(job => `<div class="job-card" onclick="viewJob('${job.id}')"><h4>${job.id}</h4><p><strong>${job.customerName}</strong> - ${job.deviceModel}</p><p>${job.issue}</p><span class="status-badge status-${job.status}">${job.status}</span></div>`).join('') : '<p>No jobs yet</p>';
        }
        
        document.getElementById('job-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const job = {
                id: 'JOB-' + Date.now(),
                customerName: document.getElementById('customer-name').value,
                customerPhone: document.getElementById('customer-phone').value,
                deviceModel: document.getElementById('device-model').value,
                deviceImei: document.getElementById('device-imei').value,
                issue: document.getElementById('issue-desc').value,
                price: parseFloat(document.getElementById('estimated-price').value),
                status: 'pending',
                createdAt: new Date().toISOString(),
                preChecklist: [],
                postChecklist: [],
                customerSignature: null,
                ownerSignature: null
            };
            jobs.push(job);
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
            if (!customers.find(c => c.phone === job.customerPhone)) {
                customers.push({ name: job.customerName, phone: job.customerPhone, jobs: [job.id] });
                localStorage.setItem('repair-customers', JSON.stringify(customers));
            }
            alert('Job created successfully! Job ID: ' + job.id);
            this.reset();
            showSection('jobs', document.querySelectorAll('.nav-btn')[2]);
        });
        
        function renderJobs() {
            document.getElementById('all-jobs').innerHTML = jobs.length ? jobs.map(job => `<div class="job-card" onclick="viewJob('${job.id}')"><h4>${job.id}</h4><p><strong>${job.customerName}</strong> - ${job.deviceModel}</p><p>${job.issue}</p><span class="status-badge status-${job.status}">${job.status}</span></div>`).join('') : '<p>No jobs yet</p>';
        }
        
        function viewJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            const checklistItems = ['Screen', 'Touch', 'Camera', 'Speaker', 'Microphone', 'WiFi', 'Bluetooth', 'Charging Port', 'Battery', 'Buttons'];
            document.getElementById('job-detail-content').innerHTML = `
                <h2>Job Details: ${job.id}</h2>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0;">
                    <h3>Customer Information</h3>
                    <p><strong>Name:</strong> ${job.customerName}</p>
                    <p><strong>Phone:</strong> ${job.customerPhone}</p>
                    <p><strong>Device:</strong> ${job.deviceModel}</p>
                    <p><strong>IMEI:</strong> ${job.deviceImei || 'N/A'}</p>
                    <p><strong>Issue:</strong> ${job.issue}</p>
                    <p><strong>Price:</strong> RM ${job.price.toFixed(2)}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-${job.status}">${job.status}</span></p>
                    <p><strong>Created:</strong> ${new Date(job.createdAt).toLocaleString()}</p>
                </div>
                <div class="checklist">
                    <h3>Pre-Repair Checklist</h3>
                    ${checklistItems.map((item, i) => `<div class="checklist-item"><input type="checkbox" id="pre-${i}" ${job.preChecklist.includes(item) ? 'checked' : ''} onchange="updateChecklist('${job.id}', 'pre', '${item}', this.checked)"><label for="pre-${i}">${item}</label></div>`).join('')}
                </div>
                <div style="margin: 20px 0;">
                    <button class="btn btn-primary" onclick="updateJobStatus('${job.id}', 'progress')">Mark In Progress</button>
                    <button class="btn btn-success" onclick="updateJobStatus('${job.id}', 'completed')">Mark Completed</button>
                </div>
                <div class="checklist">
                    <h3>Post-Repair Checklist</h3>
                    ${checklistItems.map((item, i) => `<div class="checklist-item"><input type="checkbox" id="post-${i}" ${job.postChecklist.includes(item) ? 'checked' : ''} onchange="updateChecklist('${job.id}', 'post', '${item}', this.checked)"><label for="post-${i}">${item}</label></div>`).join('')}
                </div>
                <div style="margin: 20px 0;">
                    <h3>Digital Signatures</h3>
                    <p>Customer Signature:</p>
                    <canvas id="customer-signature" class="signature-pad" width="400" height="150"></canvas>
                    <button class="btn btn-primary" onclick="captureSignature('${job.id}', 'customer')">Capture Customer Signature</button>
                    <p style="margin-top: 20px;">Owner Signature:</p>
                    <canvas id="owner-signature" class="signature-pad" width="400" height="150"></canvas>
                    <button class="btn btn-primary" onclick="captureSignature('${job.id}', 'owner')">Capture Owner Signature</button>
                </div>
                <div style="margin: 20px 0;">
                    <button class="btn btn-success" onclick="generateReceipt('${job.id}')">📄 Generate Receipt</button>
                </div>
                <div id="receipt-container" style="margin-top: 20px;"></div>
            `;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('job-detail').classList.add('active');
            initSignaturePads();
        }
        
        function updateChecklist(jobId, type, item, checked) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            const checklistKey = type + 'Checklist';
            if (checked) {
                if (!job[checklistKey].includes(item)) job[checklistKey].push(item);
            } else {
                job[checklistKey] = job[checklistKey].filter(i => i !== item);
            }
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
        }
        
        function updateJobStatus(jobId, status) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            job.status = status;
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
            alert('Job status updated to: ' + status);
            viewJob(jobId);
        }
        
        let signaturePads = {};
        
        function initSignaturePads() {
            ['customer-signature', 'owner-signature'].forEach(id => {
                const canvas = document.getElementById(id);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                let drawing = false;
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);
                canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const touch = e.touches[0]; const rect = canvas.getBoundingClientRect(); startDrawing({ offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top }); });
                canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const touch = e.touches[0]; const rect = canvas.getBoundingClientRect(); draw({ offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top }); });
                canvas.addEventListener('touchend', stopDrawing);
                function startDrawing(e) { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); }
                function draw(e) { if (!drawing) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }
                function stopDrawing() { drawing = false; }
                signaturePads[id] = canvas;
            });
        }
        
        function captureSignature(jobId, type) {
            const canvasId = type === 'customer' ? 'customer-signature' : 'owner-signature';
            const canvas = signaturePads[canvasId];
            if (!canvas) return;
            const signature = canvas.toDataURL();
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            if (type === 'customer') job.customerSignature = signature;
            else job.ownerSignature = signature;
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
            alert(type + ' signature captured!');
        }
        
        function generateReceipt(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            const warrantyDays = 30;
            const warrantyExpiry = new Date();
            warrantyExpiry.setDate(warrantyExpiry.getDate() + warrantyDays);
            const receiptHTML = `
                <div class="receipt">
                    <div class="receipt-header">
                        <h2>🔧 MOBILE REPAIR SERVICE</h2>
                        <p>Professional Repair Service</p>
                        <p>USIM Campus | Contact: 01X-XXXXXXX</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Job Information</h4>
                        <p><strong>Job ID:</strong> ${job.id}</p>
                        <p><strong>Date:</strong> ${new Date(job.createdAt).toLocaleDateString()}</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Customer Information</h4>
                        <p><strong>Name:</strong> ${job.customerName}</p>
                        <p><strong>Phone:</strong> ${job.customerPhone}</p>
                        <p><strong>Device:</strong> ${job.deviceModel}</p>
                        <p><strong>IMEI:</strong> ${job.deviceImei || 'N/A'}</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Repair Details</h4>
                        <p><strong>Issue Reported:</strong> ${job.issue}</p>
                        <p><strong>Status:</strong> ${job.status}</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Pre-Repair Checklist</h4>
                        <p>${job.preChecklist.length > 0 ? job.preChecklist.join(', ') : 'No items checked'}</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Post-Repair Checklist</h4>
                        <p>${job.postChecklist.length > 0 ? job.postChecklist.join(', ') : 'No items checked'}</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Payment</h4>
                        <p><strong>Service Fee:</strong> RM ${job.price.toFixed(2)}</p>
                        <p><strong>Warranty:</strong> ${warrantyDays} days</p>
                        <p><strong>Warranty Expiry:</strong> ${warrantyExpiry.toLocaleDateString()}</p>
                    </div>
                    <div class="receipt-section">
                        <h4>Warranty Terms</h4>
                        <ul style="margin-left: 20px;">
                            <li>${warrantyDays} days warranty for the same repair</li>
                            <li>Warranty does not cover new damage (drops, water, etc.)</li>
                            <li>Warranty void if device is opened by another party</li>
                        </ul>
                    </div>
                    <div class="signature-line">
                        <div class="signature-box">
                            ${job.customerSignature ? `<img src="${job.customerSignature}" alt="Customer Signature">` : '<div style="height: 100px; border: 1px solid #000;"></div>'}
                            <p><strong>Customer Signature</strong></p>
                            <p>${job.customerName}</p>
                        </div>
                        <div class="signature-box">
                            ${job.ownerSignature ? `<img src="${job.ownerSignature}" alt="Owner Signature">` : '<div style="height: 100px; border: 1px solid #000;"></div>'}
                            <p><strong>Owner Signature</strong></p>
                            <p>Hakieem</p>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #000;">
                        <p><strong>Thank you for your business!</strong></p>
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center;">
                    <button class="btn btn-success" onclick="downloadReceipt('${job.id}')">💾 Download Receipt</button>
                </div>
            `;
            document.getElementById('receipt-container').innerHTML = receiptHTML;
        }
        
        function downloadReceipt(jobId) {
            alert('To save receipt: Right-click on the receipt → Save image as, or use browser print function (Ctrl+P) to save as PDF');
        }
        
        function renderCustomers() {
            document.getElementById('customer-list').innerHTML = customers.length ? customers.map(customer => `<div class="job-card"><h4>${customer.name}</h4><p><strong>Phone:</strong> ${customer.phone}</p><p><strong>Total Jobs:</strong> ${customer.jobs.length}</p></div>`).join('') : '<p>No customers yet</p>';
        }
        
        updateDashboard();
    </script>
</body>
</html>
