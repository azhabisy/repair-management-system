<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Repair Pro - Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .header h1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: #6c757d; font-size: 1.1em; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav-btn { flex: 1; min-width: 150px; padding: 15px 25px; border: none; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 15px; cursor: pointer; font-size: 1em; font-weight: 600; color: #495057; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .nav-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .content { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .section { display: none; }
        .section.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 15px; box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3); position: relative; overflow: hidden; }
        .stat-card::before { content: ''; position: absolute; top: -50%; right: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%); }
        .stat-card h3 { font-size: 2.5em; margin-bottom: 5px; position: relative; z-index: 1; }
        .stat-card p { font-size: 1.1em; opacity: 0.9; position: relative; z-index: 1; }
        .stat-card.profit { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.revenue { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-card.jobs { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .chart-container { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 15px; border: 2px solid #e9ecef; border-radius: 10px; font-size: 1em; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-right: 10px; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4); }
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); color: white; }
        .job-list { display: grid; gap: 15px; }
        .job-card { background: white; padding: 20px; border-radius: 15px; border-left: 4px solid #667eea; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .job-card:hover { transform: translateX(5px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .job-card h4 { color: #667eea; margin-bottom: 10px; }
        .job-card p { color: #6c757d; margin-bottom: 5px; }
        .status-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: 600; }
        .status-pending { background: #ffc107; color: #000; }
        .status-progress { background: #17a2b8; color: white; }
        .status-completed { background: #28a745; color: white; }
        .checklist { background: #f8f9fa; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .checklist-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #e9ecef; }
        .checklist-item:last-child { border-bottom: none; }
        .checklist-item input[type="checkbox"] { margin-right: 15px; width: 20px; height: 20px; }
        .signature-pad { border: 2px solid #e9ecef; border-radius: 10px; margin-bottom: 20px; background: white; touch-action: none; }
        .price-section { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px; border-radius: 15px; margin: 20px 0; }
        .price-section h3 { margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.3); }
        .price-row:last-child { border-bottom: none; font-weight: bold; font-size: 1.2em; }
        .profit-display { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: center; font-size: 1.3em; font-weight: bold; }
        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 15px; border: 2px solid #e9ecef; border-radius: 10px; font-size: 1em; }
        .filter-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 20px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 10px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: #667eea; color: white; }
        .warranty-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: 600; background: #28a745; color: white; }
        .warranty-expired { background: #dc3545; }
        @media (max-width: 768px) { .header h1 { font-size: 1.8em; } .nav { flex-direction: column; } .nav-btn { min-width: 100%; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Mobile Repair Pro</h1>
            <p>Professional Repair Management System</p>
        </div>
        <div class="nav">
            <button class="nav-btn active" onclick="showSection('dashboard', this)">📊 Dashboard</button>
            <button class="nav-btn" onclick="showSection('new-job', this)">➕ New Job</button>
            <button class="nav-btn" onclick="showSection('jobs', this)">📋 Jobs</button>
            <button class="nav-btn" onclick="showSection('customers', this)">👥 Customers</button>
            <button class="nav-btn" onclick="showSection('warranty', this)">🛡️ Warranty</button>
        </div>
        <div class="content">
            <div id="dashboard" class="section active">
                <div class="stats-grid">
                    <div class="stat-card jobs"><h3 id="total-jobs">0</h3><p>Total Jobs</p></div>
                    <div class="stat-card revenue"><h3 id="total-revenue">RM 0</h3><p>Total Revenue</p></div>
                    <div class="stat-card profit"><h3 id="total-profit">RM 0</h3><p>Total Profit</p></div>
                    <div class="stat-card"><h3 id="active-jobs">0</h3><p>Active Jobs</p></div>
                </div>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="profitChart"></canvas>
                </div>
                <h2 style="margin: 20px 0;">Recent Jobs</h2>
                <div id="recent-jobs" class="job-list"></div>
            </div>
            <div id="new-job" class="section">
                <h2 style="margin-bottom: 20px;">Create New Job Order</h2>
                <form id="job-form">
                    <div class="form-group"><label>Customer Name *</label><input type="text" id="customer-name" required></div>
                    <div class="form-group"><label>Phone Number *</label><input type="tel" id="customer-phone" required></div>
                    <div class="form-group"><label>Device Model *</label><input type="text" id="device-model" placeholder="e.g., iPhone 13 Pro Max" required></div>
                    <div class="form-group"><label>IMEI Number</label><input type="text" id="device-imei" placeholder="15 digits"></div>
                    <div class="form-group"><label>Issue Description *</label><textarea id="issue-desc" rows="4" required></textarea></div>
                    <div class="form-group"><label>Component Cost (RM) *</label><input type="number" id="component-cost" step="0.01" required placeholder="Cost of parts"></div>
                    <div class="form-group"><label>Labour Cost (RM) *</label><input type="number" id="labour-cost" step="0.01" required placeholder="Your labour cost"></div>
                    <div class="form-group"><label>Customer Price (RM) *</label><input type="number" id="customer-price" step="0.01" required placeholder="Price customer pays"></div>
                    <div class="profit-display" id="profit-preview">Profit: RM 0.00</div>
                    <button type="submit" class="btn btn-primary">Create Job Order</button>
                </form>
            </div>
            <div id="jobs" class="section">
                <h2 style="margin-bottom: 20px;">All Jobs</h2>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔍 Search by customer name, device, or job ID..." oninput="filterJobs()">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterByStatus('all', this)">All</button>
                    <button class="filter-btn" onclick="filterByStatus('pending', this)">Pending</button>
                    <button class="filter-btn" onclick="filterByStatus('progress', this)">In Progress</button>
                    <button class="filter-btn" onclick="filterByStatus('completed', this)">Completed</button>
                </div>
                <div id="all-jobs" class="job-list"></div>
            </div>
            <div id="customers" class="section">
                <h2 style="margin-bottom: 20px;">Customer Database</h2>
                <div id="customer-list" class="job-list"></div>
            </div>
            <div id="warranty" class="section">
                <h2 style="margin-bottom: 20px;">Warranty Tracker</h2>
                <div id="warranty-list" class="job-list"></div>
            </div>
            <div id="job-detail" class="section">
                <button onclick="showSection('jobs', document.querySelectorAll('.nav-btn')[2])" class="btn btn-danger" style="margin-bottom: 20px;">← Back</button>
                <div id="job-detail-content"></div>
            </div>
        </div>
    </div>
    <script>
        let jobs = JSON.parse(localStorage.getItem('repair-jobs')) || [];
        let customers = JSON.parse(localStorage.getItem('repair-customers')) || [];
        let revenueChart, profitChart;
        let currentFilter = 'all';
        
        function showSection(sectionId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            if (btn) btn.classList.add('active');
            if (sectionId === 'dashboard') updateDashboard();
            if (sectionId === 'jobs') renderJobs();
            if (sectionId === 'customers') renderCustomers();
            if (sectionId === 'warranty') renderWarranty();
        }
        
        function updateDashboard() {
            const totalRevenue = jobs.reduce((sum, j) => sum + j.customerPrice, 0);
            const totalCost = jobs.reduce((sum, j) => sum + j.componentCost + j.labourCost, 0);
            const totalProfit = totalRevenue - totalCost;
            
            document.getElementById('total-jobs').textContent = jobs.length;
            document.getElementById('total-revenue').textContent = 'RM ' + totalRevenue.toFixed(2);
            document.getElementById('total-profit').textContent = 'RM ' + totalProfit.toFixed(2);
            document.getElementById('active-jobs').textContent = jobs.filter(j => j.status !== 'completed').length;
            
            updateCharts();
            
            const recentJobs = jobs.slice(-5).reverse();
            document.getElementById('recent-jobs').innerHTML = recentJobs.length ? recentJobs.map(job => `
                <div class="job-card" onclick="viewJob('${job.id}')">
                    <h4>${job.id}</h4>
                    <p><strong>${job.customerName}</strong> - ${job.deviceModel}</p>
                    <p>${job.issue}</p>
                    <p><strong>Revenue:</strong> RM ${job.customerPrice.toFixed(2)} | <strong>Profit:</strong> RM ${(job.customerPrice - job.componentCost - job.labourCost).toFixed(2)}</p>
                    <span class="status-badge status-${job.status}">${job.status}</span>
                </div>
            `).join('') : '<p>No jobs yet</p>';
        }
        
        function updateCharts() {
            const last7Days = [];
            const revenueData = [];
            const profitData = [];
            
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                last7Days.push(dateStr);
                
                const dayJobs = jobs.filter(j => j.createdAt && j.createdAt.startsWith(dateStr));
                const dayRevenue = dayJobs.reduce((sum, j) => sum + j.customerPrice, 0);
                const dayProfit = dayJobs.reduce((sum, j) => sum + (j.customerPrice - j.componentCost - j.labourCost), 0);
                
                revenueData.push(dayRevenue);
                profitData.push(dayProfit);
            }
            
            if (revenueChart) revenueChart.destroy();
            if (profitChart) profitChart.destroy();
            
            const ctx1 = document.getElementById('revenueChart').getContext('2d');
            revenueChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: last7Days,
                    datasets: [{
                        label: 'Revenue (RM)',
                        data: revenueData,
                        borderColor: '#f5576c',
                        backgroundColor: 'rgba(245, 87, 108, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { title: { display: true, text: 'Revenue - Last 7 Days', font: { size: 16 } } }
                }
            });
            
            const ctx2 = document.getElementById('profitChart').getContext('2d');
            profitChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: last7Days,
                    datasets: [{
                        label: 'Profit (RM)',
                        data: profitData,
                        backgroundColor: 'rgba(56, 239, 125, 0.8)',
                        borderColor: '#11998e',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { title: { display: true, text: 'Profit - Last 7 Days', font: { size: 16 } } }
                }
            });
        }
        
        document.getElementById('job-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const componentCost = parseFloat(document.getElementById('component-cost').value);
            const labourCost = parseFloat(document.getElementById('labour-cost').value);
            const customerPrice = parseFloat(document.getElementById('customer-price').value);
            const profit = customerPrice - componentCost - labourCost;
            
            const job = {
                id: 'JOB-' + Date.now(),
                customerName: document.getElementById('customer-name').value,
                customerPhone: document.getElementById('customer-phone').value,
                deviceModel: document.getElementById('device-model').value,
                deviceImei: document.getElementById('device-imei').value,
                issue: document.getElementById('issue-desc').value,
                componentCost: componentCost,
                labourCost: labourCost,
                customerPrice: customerPrice,
                profit: profit,
                status: 'pending',
                createdAt: new Date().toISOString(),
                preChecklist: [],
                postChecklist: [],
                customerSignature: null,
                ownerSignature: null
            };
            
            jobs.push(job);
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
            
            if (!customers.find(c => c.phone === job.customerPhone)) {
                customers.push({ name: job.customerName, phone: job.customerPhone, jobs: [job.id] });
                localStorage.setItem('repair-customers', JSON.stringify(customers));
            }
            
            alert('Job created successfully! Job ID: ' + job.id + '\nProfit: RM ' + profit.toFixed(2));
            this.reset();
            document.getElementById('profit-preview').textContent = 'Profit: RM 0.00';
            showSection('jobs', document.querySelectorAll('.nav-btn')[2]);
        });
        
        ['component-cost', 'labour-cost', 'customer-price'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateProfit);
        });
        
        function calculateProfit() {
            const componentCost = parseFloat(document.getElementById('component-cost').value) || 0;
            const labourCost = parseFloat(document.getElementById('labour-cost').value) || 0;
            const customerPrice = parseFloat(document.getElementById('customer-price').value) || 0;
            const profit = customerPrice - componentCost - labourCost;
            document.getElementById('profit-preview').textContent = 'Profit: RM ' + profit.toFixed(2);
        }
        
        function renderJobs() {
            let filteredJobs = jobs;
            
            if (currentFilter !== 'all') {
                filteredJobs = jobs.filter(j => j.status === currentFilter);
            }
            
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            if (searchTerm) {
                filteredJobs = filteredJobs.filter(j => 
                    j.customerName.toLowerCase().includes(searchTerm) ||
                    j.deviceModel.toLowerCase().includes(searchTerm) ||
                    j.id.toLowerCase().includes(searchTerm)
                );
            }
            
            document.getElementById('all-jobs').innerHTML = filteredJobs.length ? filteredJobs.map(job => `
                <div class="job-card" onclick="viewJob('${job.id}')">
                    <h4>${job.id}</h4>
                    <p><strong>${job.customerName}</strong> - ${job.deviceModel}</p>
                    <p>${job.issue}</p>
                    <p><strong>Revenue:</strong> RM ${job.customerPrice.toFixed(2)} | <strong>Profit:</strong> RM ${job.profit.toFixed(2)}</p>
                    <span class="status-badge status-${job.status}">${job.status}</span>
                </div>
            `).join('') : '<p>No jobs found</p>';
        }
        
        function filterByStatus(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderJobs();
        }
        
        function filterJobs() {
            renderJobs();
        }
        
        function viewJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            
            const checklistItems = ['Screen', 'Touch', 'Camera', 'Speaker', 'Microphone', 'WiFi', 'Bluetooth', 'Charging Port', 'Battery', 'Buttons'];
            
            document.getElementById('job-detail-content').innerHTML = `
                <h2>Job Details: ${job.id}</h2>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 15px; margin: 20px 0;">
                    <h3>Customer Information</h3>
                    <p><strong>Name:</strong> ${job.customerName}</p>
                    <p><strong>Phone:</strong> ${job.customerPhone}</p>
                    <p><strong>Device:</strong> ${job.deviceModel}</p>
                    <p><strong>IMEI:</strong> ${job.deviceImei || 'N/A'}</p>
                    <p><strong>Issue:</strong> ${job.issue}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-${job.status}">${job.status}</span></p>
                    <p><strong>Created:</strong> ${new Date(job.createdAt).toLocaleString()}</p>
                </div>
                
                <div class="price-section">
                    <h3>💰 Financial Details (Internal)</h3>
                    <div class="price-row"><span>Component Cost:</span><span>RM ${job.componentCost.toFixed(2)}</span></div>
                    <div class="price-row"><span>Labour Cost:</span><span>RM ${job.labourCost.toFixed(2)}</span></div>
                    <div class="price-row"><span>Total Cost:</span><span>RM ${(job.componentCost + job.labourCost).toFixed(2)}</span></div>
                    <div class="price-row"><span>Customer Price:</span><span>RM ${job.customerPrice.toFixed(2)}</span></div>
                    <div class="profit-display">Net Profit: RM ${job.profit.toFixed(2)}</div>
                </div>
                
                <div class="checklist">
                    <h3>Pre-Repair Checklist</h3>
                    ${checklistItems.map((item, i) => `
                        <div class="checklist-item">
                            <input type="checkbox" id="pre-${i}" ${job.preChecklist.includes(item) ? 'checked' : ''} onchange="updateChecklist('${job.id}', 'pre', '${item}', this.checked)">
                            <label for="pre-${i}">${item}</label>
                        </div>
                    `).join('')}
                </div>
                
                <div style="margin: 20px 0;">
                    <button class="btn btn-primary" onclick="updateJobStatus('${job.id}', 'progress')">Mark In Progress</button>
                    <button class="btn btn-success" onclick="updateJobStatus('${job.id}', 'completed')">Mark Completed</button>
                </div>
                
                <div class="checklist">
                    <h3>Post-Repair Checklist</h3>
                    ${checklistItems.map((item, i) => `
                        <div class="checklist-item">
                            <input type="checkbox" id="post-${i}" ${job.postChecklist.includes(item) ? 'checked' : ''} onchange="updateChecklist('${job.id}', 'post', '${item}', this.checked)">
                            <label for="post-${i}">${item}</label>
                        </div>
                    `).join('')}
                </div>
                
                <div style="margin: 20px 0;">
                    <h3>Digital Signatures</h3>
                    <p>Customer Signature:</p>
                    <canvas id="customer-signature" class="signature-pad" width="400" height="150"></canvas>
                    <button class="btn btn-primary" onclick="captureSignature('${job.id}', 'customer')">Capture Customer Signature</button>
                    
                    <p style="margin-top: 20px;">Owner Signature:</p>
                    <canvas id="owner-signature" class="signature-pad" width="400" height="150"></canvas>
                    <button class="btn btn-primary" onclick="captureSignature('${job.id}', 'owner')">Capture Owner Signature</button>
                </div>
                
                <div style="margin: 20px 0;">
                    <button class="btn btn-success" onclick="generateAndDownloadPDF('${job.id}')">📄 Download PDF Receipt</button>
                </div>
                
                <div id="receipt-preview" style="margin-top: 20px;"></div>
            `;
            
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('job-detail').classList.add('active');
            initSignaturePads();
        }
        
        function updateChecklist(jobId, type, item, checked) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            
            const checklistKey = type + 'Checklist';
            if (checked) {
                if (!job[checklistKey].includes(item)) job[checklistKey].push(item);
            } else {
                job[checklistKey] = job[checklistKey].filter(i => i !== item);
            }
            
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
        }
        
        function updateJobStatus(jobId, status) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            
            job.status = status;
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
            alert('Job status updated to: ' + status);
            viewJob(jobId);
        }
        
        let signaturePads = {};
        
        function initSignaturePads() {
            ['customer-signature', 'owner-signature'].forEach(id => {
                const canvas = document.getElementById(id);
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                
                let drawing = false;
                
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);
                
                canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = canvas.getBoundingClientRect();
                    startDrawing({ offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top });
                });
                
                canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = canvas.getBoundingClientRect();
                    draw({ offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top });
                });
                
                canvas.addEventListener('touchend', stopDrawing);
                
                function startDrawing(e) {
                    drawing = true;
                    ctx.beginPath();
                    ctx.moveTo(e.offsetX, e.offsetY);
                }
                
                function draw(e) {
                    if (!drawing) return;
                    ctx.lineTo(e.offsetX, e.offsetY);
                    ctx.stroke();
                }
                
                function stopDrawing() {
                    drawing = false;
                }
                
                signaturePads[id] = canvas;
            });
        }
        
        function captureSignature(jobId, type) {
            const canvasId = type === 'customer' ? 'customer-signature' : 'owner-signature';
            const canvas = signaturePads[canvasId];
            if (!canvas) return;
            
            const signature = canvas.toDataURL();
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;
            
            if (type === 'customer') job.customerSignature = signature;
            else job.ownerSignature = signature;
            
            localStorage.setItem('repair-jobs', JSON.stringify(jobs));
            alert(type + ' signature captured!');
        }
        
        async function generateAndDownloadPDF(jobId) {
            const job = jobs.find(j => j.id === jobId);
            if (!job) return;

            const warrantyExpiry = new Date();
            warrantyExpiry.setDate(warrantyExpiry.getDate() + warrantyDays);
            
            const receiptHTML = `

                        <p style="color: #6c757d; margin: 5px 0;">Professional Repair Service</p>
                        <p style="color: #6c757d; margin: 5px 0;">USIM Campus | Contact: 01X-XXXXXXX</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Job Information</h3>
                        <p><strong>Job ID:</strong> ${job.id}</p>
                        <p><strong>Date:</strong> ${new Date(job.createdAt).toLocaleDateString()}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Customer Information</h3>
                        <p><strong>Name:</strong> ${job.customerName}</p>
                        <p><strong>Phone:</strong> ${job.customerPhone}</p>
                        <p><strong>Device:</strong> ${job.deviceModel}</p>
                        <p><strong>IMEI:</strong> ${job.deviceImei || 'N/A'}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Repair Details</h3>
                        <p><strong>Issue Reported:</strong> ${job.issue}</p>
                        <p><strong>Status:</strong> ${job.status}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Pre-Repair Checklist</h3>
                        <p>${job.preChecklist.length > 0 ? job.preChecklist.join(', ') : 'No items checked'}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Post-Repair Checklist</h3>
                        <p>${job.postChecklist.length > 0 ? job.postChecklist.join(', ') : 'No items checked'}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 10px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Payment</h3>
                        <p><strong>Service Fee:</strong> RM ${job.customerPrice.toFixed(2)}</p>
                        <p><strong>Warranty:</strong> ${warrantyDays} days</p>
                        <p><strong>Warranty Expiry:</strong> ${warrantyExpiry.toLocaleDateString()}</p>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 5px;">Warranty Terms</h3>
                        <ul style="margin-left: 20px;">
                            <li>${warrantyDays} days warranty for the same repair</li>
                            <li>Warranty does not cover new damage (drops, water, etc.)</li>
                            <li>Warranty void if device is opened by another party</li>
                        </ul>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 2px dashed #667eea;">
                        <div style="text-align: center; flex: 1;">
                            ${job.customerSignature ? `<img src="${job.customerSignature}" style="max-width: 200px; height: 100px; border: 1px solid #000; margin-bottom: 10px;">` : '<div style="height: 100px; border: 1px solid #000; width: 200px; margin: 0 auto 10px;"></div>'}
                            <p><strong>Customer Signature</strong></p>
                            <p>${job.customerName}</p>
                        </div>
                        <div style="text-align: center; flex: 1;">
                            ${job.ownerSignature ? `<img src="${job.ownerSignature}" style="max-width: 200px; height: 100px; border: 1px solid #000; margin-bottom: 10px;">` : '<div style="height: 100px; border: 1px solid #000; width: 200px; margin: 0 auto 10px;"></div>'}
                            <p><strong>Owner Signature</strong></p>
                            <p>Hakieem</p>
                        </div>
                    </div>
                    
                    <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #667eea;">
                        <p style="font-weight: bold; color: #667eea;">Thank you for your business!</p>
                    </div>
                </div>
            `;
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = receiptHTML;
            tempDiv.style.position = 'fixed';
            tempDiv.style.left = '-9999px';
            document.body.appendChild(tempDiv);
            
            const canvas = await html2canvas(document.getElementById('receipt-content'));
            const imgData = canvas.toDataURL('image/png');
            
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 210;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            
            pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
            pdf.save(`Receipt-${job.id}.pdf`);
            
            document.body.removeChild(tempDiv);
            alert('PDF downloaded successfully!');
        }
        
        function renderCustomers() {
            document.getElementById('customer-list').innerHTML = customers.length ? customers.map(customer => `
                <div class="job-card">
                    <h4>${customer.name}</h4>
                    <p><strong>Phone:</strong> ${customer.phone}</p>
                    <p><strong>Total Jobs:</strong> ${customer.jobs.length}</p>
                </div>
            `).join('') : '<p>No customers yet</p>';
        }
        
        function renderWarranty() {
            const warrantyJobs = jobs.filter(j => j.status === 'completed');
            
            document.getElementById('warranty-list').innerHTML = warrantyJobs.length ? warrantyJobs.map(job => {
                const warrantyExpiry = new Date(job.createdAt);
                warrantyExpiry.setDate(warrantyExpiry.getDate() + 30);
                const isExpired = new Date() > warrantyExpiry;
                
                return `
                    <div class="job-card">
                        <h4>${job.id}</h4>
                        <p><strong>${job.customerName}</strong> - ${job.deviceModel}</p>
                        <p><strong>Completed:</strong> ${new Date(job.createdAt).toLocaleDateString()}</p>
                        <p><strong>Warranty Expiry:</strong> ${warrantyExpiry.toLocaleDateString()}</p>
                        <span class="warranty-badge ${isExpired ? 'warranty-expired' : ''}">${isExpired ? 'EXPIRED' : 'ACTIVE'}</span>
                    </div>
                `;
            }).join('') : '<p>No completed jobs yet</p>';
        }
        
        updateDashboard();
    </script>
